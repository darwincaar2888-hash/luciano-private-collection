<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luciano Private Collection</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
}

.container{
max-width:1200px;
margin:auto;
padding:15px;
}

h2{
margin-top:30px;
}

.search{
width:100%;
padding:14px;
border-radius:12px;
border:none;
margin-bottom:20px;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:#0b0b0b;
border-radius:20px;
overflow:hidden;
border:1px solid #1a1a1a;
position:relative;
}

.card img{
width:100%;
height:260px;
object-fit:contain;
background:#d8e3e0;
}

.badge{
position:absolute;
top:10px;
left:10px;
background:red;
padding:5px 10px;
border-radius:10px;
font-size:12px;
}

.stock{
position:absolute;
top:10px;
right:10px;
background:#ff9900;
padding:5px 10px;
border-radius:10px;
font-size:12px;
}

.content{
padding:15px;
}

.name{
font-size:18px;
font-weight:bold;
}

.price{
color:#d4af5a;
font-size:24px;
}

.old{
text-decoration:line-through;
opacity:.5;
}

.buy{
display:block;
text-align:center;
background:#25D366;
padding:12px;
border-radius:10px;
margin-top:10px;
color:#fff;
text-decoration:none;
font-weight:bold;
}

.details{
display:block;
text-align:center;
background:#222;
padding:10px;
border-radius:10px;
margin-top:8px;
color:#fff;
}

.fav{
position:absolute;
bottom:10px;
right:10px;
font-size:22px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<input class="search" placeholder="🔎 Buscar producto..." onkeyup="buscar(this.value)">

<div id="tienda"></div>

</div>

<script>
const numero="593992064254";

/* ================= PRODUCTOS ================= */

const productos = [

/* ================= KITS FETICHE ================= */

{cat:"Kits Fetiche",n:"Kit Fetiche Lujuria",p:40,img:"kit-fetiche-lujuria.jpg"},
{cat:"Kits Fetiche",n:"Kit Fetiche Dark Night",p:35,img:"kit-dark-night.jpg"},

/* ================= BDSM ================= */
{cat:"BDSM",n:"Jaula de Pene",p:30,img:"jaula-pene-metal.jpg"},
{cat:"BDSM",n:"Columpio Techo Negro",p:40,img:"accesorio-columpio-techo-bdsm-negro.jpg"},
{cat:"BDSM",n:"Columpio Techo Rojo",p:40,img:"accesorio-columpio-techo-bdsm-rojo.jpg"},
{cat:"BDSM",n:"Paleta Spanking Cuero",p:20,img:"spanking-paleta-cuero-negro.jpg"},
{cat:"BDSM",n:"Antifaz Cuero Negro",p:15,img:"accesorio-antifaz-cuero-negro.jpg"},

{cat:"Anal",n:"Plug Anal Baxter",p:15,img:"plug-anal-baxter.jpg"},
{cat:"Anal",n:"Plug Anal Pleasure",p:15,img:"plug-anal-pleasure.jpg"},
{cat:"Anal",n:"Plug Cola Conejo Negra",p:18,img:"plug-cola-conejo-negra.jpg"},
{cat:"Anal",n:"Plug Cola Conejo Roja",p:18,img:"plug-cola-conejo-roja.jpg"},
{cat:"Anal",n:"Plug Cola Conejo Rosada",p:18,img:"plug-cola-conejo-rosada.jpg"},
{cat:"Anal",n:"Plug Cola Conejo Blanca",p:18,img:"plug-cola-conejo-blanca.jpg"},

];

/* ================= RENDER ================= */

function render(lista){
const tienda=document.getElementById("tienda");
tienda.innerHTML="";

let categorias=[...new Set(lista.map(p=>p.cat))];

categorias.forEach(cat=>{
tienda.innerHTML+=`<h2>${cat}</h2><div class="grid" id="${cat}"></div>`;
});

lista.forEach(p=>{

let oferta=Math.random()>0.75;
let stock=Math.random()>0.75;

let precio=p.p;
let old="";

if(oferta){
precio=(p.p*0.8).toFixed(2);
old=`<div class="old">$${p.p}</div>`;
}

document.getElementById(p.cat).innerHTML+=`

<div class="card">

${oferta?'<div class="badge">OFERTA</div>':''}
${stock?'<div class="stock">Últimas</div>':''}

<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'">

<div class="content">
<div class="name">${p.n}</div>
${old}
<div class="price">$${precio}</div>

<a class="buy" href="https://wa.me/${numero}?text=Quiero ${p.n}" target="_blank">Comprar</a>
<div class="details">Ver más</div>
</div>

<div class="fav" onclick="this.style.color=this.style.color==='red'?'white':'red'">❤️</div>

</div>
`;
});

}

/* ================= BUSCADOR ================= */

function buscar(txt){
let f=productos.filter(p=>p.n.toLowerCase().includes(txt.toLowerCase()));
render(f);
}

/* INIT */
render(productos);

</script>

</body>
</html>
